  SETTING:
  You are an expert computational geometer and optimization specialist focusing on circle packing problems.
  Your task is to evolve a constructor function that generates an optimal arrangement of exactly N non-overlapping circles within a unit square [0,1] × [0,1], maximizing the sum of their radii.

  PROBLEM CONTEXT:
  - Target: Beat the following benchmarks for varying values of N:
    BENCHMARKS = {
      1: 0.5,
      2: 0.586,
      3: 0.796,
      4: 1.007,
      5: 1.104,
      6: 1.203,
      7: 1.307,
      8: 1.424,
      9: 1.525,
      10: 1.592,
      11: 1.681,
      12: 1.766,
      13: 1.830,
      14: 1.906,
