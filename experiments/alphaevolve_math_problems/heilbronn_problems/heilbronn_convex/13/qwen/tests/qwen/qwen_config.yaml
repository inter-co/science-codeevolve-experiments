CODEBASE_PATH: src/
EMBEDDING:
  dimensions: 128
  model_name: AZURE_TEXT-EMBEDDING-3-SMALL
  retries: 3
  verify_ssl: false
EVAL_FILE_NAME: evaluate.py
EVAL_TIMEOUT: 180
EVOLVE_CONFIG:
  ckpt: 10
  early_stopping_rounds: null
  evolve_end_marker: '# EVOLVE-BLOCK-END'
  evolve_start_marker: '# EVOLVE-BLOCK-START'
  exploration_rate: 0.2
  fitness_key: benchmark_ratio
  init_pop: 15
  max_chat_depth: 5
  max_size: null
  meta_prompting: true
  migration_interval: 30
  migration_rate: 0.1
  migration_topology: ring
  mp_end_marker: '# PROMPT-BLOCK-END'
  mp_start_marker: '# PROMPT-BLOCK-START'
  num_epochs: 700
  num_inspirations: 3
  num_islands: 10
  scheduler_kwargs:
    decrease_factor: 0.95
    increase_factor: 1.05
    max_rate: 0.5
    min_rate: 0.2
    plateau_threshold: 5
  selection_kwargs:
    roulette_by_rank: true
  selection_policy: roulette
  type: PlateauScheduler
  use_embedding: false
  use_map_elites: true
  use_scheduler: true
EXPLOITATION_ENSEMBLE:
- model_name: AWS_QWEN-QWEN3-CODER-30B-INSTRUCT
  retries: 3
  temp: 0.7
  top_p: 0.8
  verify_ssl: false
  weight: 1
EXPLORATION_ENSEMBLE:
- model_name: AWS_QWEN-QWEN3-CODER-30B-INSTRUCT
  retries: 3
  temp: 0.7
  top_p: 0.8
  verify_ssl: false
  weight: 1
INIT_FILE_DATA:
  filename: init_program.py
  language: python
MAP_ELITES:
  elite_map_kwargs:
    max_iter: 300
    num_centroids: 40
    num_init_samples: 1000
    tolerance: 0.0001
  elite_map_type: cvt
  features:
  - max_val: 1.1
    min_val: 0
    name: benchmark_ratio
  - max_val: 180
    min_val: 0
    name: eval_time
MAX_MEM_BYTES: 1000000000
MEM_CHECK_INTERVAL_S: 0.1
SAMPLER_AUX_LM:
  model_name: AWS_QWEN-QWEN3-CODER-30B-INSTRUCT
  retries: 3
  temp: 0.7
  top_p: 0.8
  verify_ssl: false
  weight: 1
SYS_MSG: "# PROMPT-BLOCK-START\nSETTING:\nYou are an expert computational geometer\
  \ and optimization specialist with deep expertise in the Heilbronn triangle problem\
  \ - a fundamental challenge in discrete geometry first posed by Hans Heilbronn in\
  \ 1957.\nThis problem asks for the optimal placement of n points within a convex\
  \ region of unit area to maximize the area of the smallest triangle formed by any\
  \ three of these points. \nYour expertise spans classical geometric optimization,\
  \ modern computational methods, and the intricate mathematical properties that govern\
  \ point configurations in constrained spaces.\n\nPROBLEM SPECIFICATION:\nDesign\
  \ and implement a constructor function that generates an optimal arrangement of\
  \ exactly 13 points within or on the boundary of a unit-area convex region. The\
  \ solution must:\n- Place all 13 points within or on a convex boundary\n- Maximize\
  \ the minimum triangle area among all C(13,3) = 286 possible triangles\n- Return\
  \ deterministic, reproducible results\n- Execute efficiently within computational\
  \ constraints\n\nCOMPUTATIONAL RESOURCES & IMPLEMENTATION GUIDELINES:\n**Core packages**:\
  \ numpy, scipy, sympy, pandas, networkx, jax, torch, numba, scikit-learn\n\n**Additional\
  \ useful packages**:\n- **Advanced optimization**: `deap` (evolutionary algorithms),\
  \ `nevergrad` (gradient-free optimization)\n- **Metaheuristics**: `scikit-opt` (PSO,\
  \ GA, SA), `optuna` (Bayesian optimization), `hyperopt` (hyperparameter tuning)\n\
  - **Geometric computation**: `shapely` (computational geometry), `scipy.spatial`\
  \ (Delaunay, Voronoi, ConvexHull), `trimesh` (mesh processing)\n- **Specialized\
  \ algorithms**: `cvxpy` (convex optimization), `pyomo` (optimization modeling),\
  \ `casadi` (nonlinear optimization)\n- **High-performance computing**: `cython`\
  \ (C extensions), `dask` (parallel computing)\n- **Quasi-random sequences**: `sobol_seq`\
  \ for low-discrepancy initialization\n\nPERFORMANCE METRICS:\n1. **min_area_normalized**:\
  \ (Area of smallest triangle) / (Area of convex hull) [PRIMARY - MAXIMIZE]\n2. **benchmark_ratio**:\
  \ min_area_normalized / 0.030936889034895654 [BENCHMARK COMPARISON - TARGET > 1.0]\n\
  3. **eval_time**: Execution time in seconds [EFFICIENCY - secondary priority]\n\n\
  TECHNICAL REQUIREMENTS:\n- **Determinism**: Use fixed random seeds if employing\
  \ stochastic methods for reproducibility\n- **Error handling**: Graceful handling\
  \ of optimization failures or infeasible configurations\n\nCOMPUTATIONAL BUDGET:\n\
  - **Time limit**: 180 seconds maximum execution time\n- **Memory limit**: 1 GB\n\
  \n# PROMPT-BLOCK-END\n    \n"
