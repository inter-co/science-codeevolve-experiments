CODEBASE_PATH: src/
EMBEDDING:
  dimensions: 128
  model_name: AZURE_TEXT-EMBEDDING-3-SMALL
  retries: 3
  verify_ssl: false
EVAL_FILE_NAME: evaluate.py
EVAL_TIMEOUT: 90
EVOLVE_CONFIG:
  ckpt: 10
  early_stopping_rounds: null
  evolve_end_marker: '# EVOLVE-BLOCK-END'
  evolve_start_marker: '# EVOLVE-BLOCK-START'
  exploration_rate: 0.2
  fitness_key: benchmark_ratio
  init_pop: 15
  max_chat_depth: 5
  max_size: null
  meta_prompting: true
  migration_interval: 30
  migration_rate: 0.1
  migration_topology: ring
  mp_end_marker: '# PROMPT-BLOCK-END'
  mp_start_marker: '# PROMPT-BLOCK-START'
  num_epochs: 500
  num_inspirations: 3
  num_islands: 10
  scheduler_kwargs:
    decrease_factor: 0.95
    increase_factor: 1.05
    max_rate: 0.5
    min_rate: 0.2
    plateau_threshold: 5
  selection_kwargs:
    roulette_by_rank: true
  selection_policy: roulette
  type: PlateauScheduler
  use_embedding: false
  use_map_elites: true
  use_scheduler: true
EXPLOITATION_ENSEMBLE:
- model_name: AWS_QWEN-QWEN3-CODER-30B-INSTRUCT
  retries: 3
  temp: 0.7
  top_p: 0.8
  verify_ssl: false
  weight: 1
EXPLORATION_ENSEMBLE:
- model_name: AWS_QWEN-QWEN3-CODER-30B-INSTRUCT
  retries: 3
  temp: 0.7
  top_p: 0.8
  verify_ssl: false
  weight: 1
INIT_FILE_DATA:
  filename: init_program.py
  language: python
MAP_ELITES:
  elite_map_type: grid
  features:
  - max_val: 1.2
    min_val: 0
    name: benchmark_ratio
    num_bins: 100
  - max_val: 90
    min_val: 0
    name: eval_time
    num_bins: 20
MAX_MEM_BYTES: 5000000000
MEM_CHECK_INTERVAL_S: 0.1
SAMPLER_AUX_LM:
  model_name: AWS_QWEN-QWEN3-CODER-30B-INSTRUCT
  retries: 3
  temp: 0.7
  top_p: 0.8
  verify_ssl: false
  weight: 1
SYS_MSG: "# PROMPT-BLOCK-START\n\nSETTING:\nYou are an expert in harmonic analysis,\
  \ functional inequalities, and optimization with deep expertise in autoconvolution\
  \ norms, step function constructions, and numerical integration methods.\nYour mission\
  \ is to evolve and optimize a function that discovers step function constructions\
  \ to improve the lower bound on the second autocorrelation inequality constant C\u2082\
  .\n\nPROBLEM CONTEXT:\n- **Objective**: Find a sequence of non-negative real numbers\
  \ (representing heights of equally-spaced steps on [-1/4, 1/4]) that maximizes C\u2082\
  \n- **Benchmark**: Beat AlphaEvolve's result of C\u2082 = 0.962\n- **Known bounds**:\
  \ 0.88922 \u2264 C\u2082 \u2264 1 (theoretical upper bound is 1)\n- **Mathematical\
  \ formulation**: For step function f with autoconvolution g = f*f, we have C\u2082\
  \ = ||g||\u2082\xB2 / (||g||\u2081 \xB7 ||g||\u221E)\n- **Norms computed on autoconvolution**:\n\
  \  * ||g||\u2082\xB2: L2-norm squared, computed via piecewise linear integration\
  \ over convolution\n  * ||g||\u2081: L1-norm, approximated as sum(|g|) / (len(g)\
  \ + 1)\n  * ||g||\u221E: Infinity-norm, computed as max(|g|)\n- **Constraints**:\n\
  \  * All step heights must be non-negative (negative values clipped to 0)\n  * Sequence\
  \ length n can vary (AlphaEvolve used 50,000; you may explore different ranges)\n\
  \  * Steps are equally-spaced on the interval [-1/4, 1/4]\n\nCOMPUTATIONAL RESOURCES\
  \ & IMPLEMENTATION GUIDELINES:\n**Core packages**: numpy, scipy, sympy, pandas,\
  \ networkx, jax, torch, numba, scikit-learn\n\n**Additional useful packages**:\n\
  - **Global optimization**: `deap` (evolutionary algorithms), `platypus` (multi-objective\
  \ optimization), `pymoo` (evolutionary computation)\n- **Metaheuristics**: `scikit-opt`\
  \ (PSO, GA, SA, DE), `nevergrad` (gradient-free optimization), `optuna` (Bayesian\
  \ optimization)\n- **Signal processing**: `scipy.signal` (convolution operations),\
  \ `scipy.fft` (fast convolution via FFT)\n- **Numerical integration**: `scipy.integrate`\
  \ (quadrature methods), though evaluator uses trapezoidal-like piecewise linear\
  \ integration\n- **Parallel computing**: `joblib` (parallel loops), `multiprocessing`,\
  \ `concurrent.futures`, `ray` (distributed computing)\n- **Performance**: `numba`\
  \ (@jit compilation for loops), `cython`, `numexpr` (fast array operations)\n- **Sparse\
  \ representations**: `scipy.sparse` (if exploiting sparsity in step functions)\n\
  \nPERFORMANCE METRICS:\n1. **c2**: C\u2082 value (PRIMARY OBJECTIVE - maximize this)\n\
  2. **benchmark_ratio**: c2 / 0.962 (success indicator - values > 1.0 mean you've\
  \ beaten AlphaEvolve)\n3. **eval_time**: Execution time in seconds \n\nTECHNICAL\
  \ REQUIREMENTS:\n- **Determinism**: Use fixed random seeds for reproducibility across\
  \ runs\n- **Robustness**: Handle edge cases (empty sequences, all zeros, numerical\
  \ instability in norm computations)\n- **Numerical stability**: Be mindful of divisions\
  \ when ||g||\u2081 or ||g||\u221E are small\n\nMATHEMATICAL INSIGHTS:\n- The autoconvolution\
  \ g[k] = \u03A3\u1D62 f[i] \xB7 f[k-i] is the central object\n- C\u2082 = ||g||\u2082\
  \xB2 / (||g||\u2081 \xB7 ||g||\u221E) measures the relationship between different\
  \ norms of g\n- To maximize C\u2082, we want ||g||\u2082\xB2 to be large relative\
  \ to the product ||g||\u2081 \xB7 ||g||\u221E\n- Higher peak values in g (large\
  \ ||g||\u221E) tend to decrease C\u2082 unless ||g||\u2082\xB2 grows even faster\n\
  - More uniform distributions in g (flatter profiles) tend to increase the ratio\
  \ ||g||\u2082\xB2 / (||g||\u2081 \xB7 ||g||\u221E)\n- The piecewise linear integration\
  \ method for ||g||\u2082\xB2 uses trapezoidal rule: for interval with heights y\u2081\
  , y\u2082 and width h, contribution is (h/3)(y\u2081\xB2 + y\u2081y\u2082 + y\u2082\
  \xB2)\n\nCOMPUTATIONAL BUDGET:\n- **Time limit**: 90 seconds maximum execution time\n\
  - **Memory limit**: 5 GB\n\n# PROMPT-BLOCK-END\n    \n"
