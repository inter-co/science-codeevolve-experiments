CODEBASE_PATH: src/
EMBEDDING:
  dimensions: 128
  model_name: AZURE_TEXT-EMBEDDING-3-SMALL
  retries: 3
  verify_ssl: false
EVAL_FILE_NAME: evaluate.py
EVAL_TIMEOUT: 60
EVOLVE_CONFIG:
  ckpt: 10
  early_stopping_rounds: null
  evolve_end_marker: '# EVOLVE-BLOCK-END'
  evolve_start_marker: '# EVOLVE-BLOCK-START'
  exploration_rate: 0.2
  fitness_key: benchmark_ratio
  init_pop: 20
  max_chat_depth: 5
  max_size: null
  meta_prompting: true
  migration_interval: 30
  migration_rate: 0.1
  migration_topology: ring
  mp_end_marker: '# PROMPT-BLOCK-END'
  mp_start_marker: '# PROMPT-BLOCK-START'
  num_epochs: 250
  num_inspirations: 2
  num_islands: 10
  scheduler_kwargs:
    decrease_factor: 0.95
    increase_factor: 1.05
    max_rate: 0.5
    min_rate: 0.2
    plateau_threshold: 5
  selection_kwargs:
    roulette_by_rank: true
  selection_policy: roulette
  type: PlateauScheduler
  use_embedding: false
  use_map_elites: true
  use_scheduler: true
EXPLOITATION_ENSEMBLE:
- model_name: AWS_QWEN-QWEN3-CODER-30B-INSTRUCT
  retries: 3
  temp: 0.7
  top_p: 0.8
  verify_ssl: false
  weight: 1
EXPLORATION_ENSEMBLE:
- model_name: AWS_QWEN-QWEN3-CODER-30B-INSTRUCT
  retries: 3
  temp: 0.7
  top_p: 0.8
  verify_ssl: false
  weight: 1
INIT_FILE_DATA:
  filename: init_program.py
  language: python
MAP_ELITES:
  elite_map_kwargs:
    max_iter: 300
    num_centroids: 60
    num_init_samples: 1000
    tolerance: 0.0001
  elite_map_type: cvt
  features:
  - max_val: 2.8
    min_val: 0
    name: radii_sum
  - max_val: 1.2
    min_val: 0
    name: benchmark_ratio
  - max_val: 180
    min_val: 0
    name: eval_time
MAX_MEM_BYTES: 1000000000
MEM_CHECK_INTERVAL_S: 0.1
SAMPLER_AUX_LM:
  model_name: AWS_QWEN-QWEN3-CODER-30B-INSTRUCT
  retries: 3
  temp: 0.7
  top_p: 0.8
  verify_ssl: false
  weight: 1
SYS_MSG: "# PROMPT-BLOCK-START\n\nSETTING:\nYou are an expert computational geometer\
  \ and optimization specialist focusing on circle packing problems.\nYour task is\
  \ to evolve a constructor function that generates an optimal arrangement of exactly\
  \ 26 non-overlapping circles within a unit square [0,1] \xD7 [0,1], maximizing the\
  \ sum of their radii.\n\nPROBLEM CONTEXT:\n- Target: Beat the AlphaEvolve benchmark\
  \ of sum_radii = 2.6358627564136983\n- Constraint: All circles must be fully contained\
  \ within the unit square with no overlaps\n- Mathematical formulation: For circle\
  \ i at position (xi, yi) with radius ri:\n  * Containment: ri \u2264 xi \u2264 1-ri\
  \ and ri \u2264 yi \u2264 1-ri\n  * Non-overlap: \u221A[(xi-xj)\xB2 + (yi-yj)\xB2\
  ] \u2265 ri + rj for all i\u2260j\n  * Objective: maximize \u03A3ri subject to above\
  \ constraints\n\nCOMPUTATIONAL BUDGET:\n- **Time limit**: 60 seconds maximum execution\
  \ time\n- **Memory limit**: 1 GB\n\nCOMPUTATIONAL RESOURCES & IMPLEMENTATION GUIDELINES:\n\
  **Core packages**: numpy, scipy, sympy, pandas, networkx, jax, torch, numba, scikit-learn\n\
  \n**Additional useful packages**:\n- **Optimization**: `deap` (evolutionary algorithms),\
  \ `platypus` (multi-objective optimization)\n- **Geometric computing**: `shapely`\
  \ (geometric operations), `rtree` (spatial indexing), `scipy.spatial` (KDTree, Voronoi)\n\
  - **Constraint programming**: `python-constraint`, `ortools` (Google OR-Tools)\n\
  - **Physics simulation**: `pymunk` (2D physics), `pybullet` (physics engine)\n-\
  \ **Performance**: `cython`, `joblib` (parallelization)\n\nPERFORMANCE METRICS:\n\
  1. **sum_radii**: Total sum of all 26 circle radii (PRIMARY OBJECTIVE - maximize)\n\
  2. **benchmark_ratio**: sum_radii / 2.6358627564136983 (progress toward beating\
  \ benchmark)  \n3. **eval_time**: Execution time in seconds (keep reasonable, prefer\
  \ accuracy over speed)\n\nTECHNICAL REQUIREMENTS:\n- **Determinism**: Use fixed\
  \ random seeds if employing stochastic methods for reproducibility\n- **Error handling**:\
  \ Graceful handling of optimization failures or infeasible configurations\n- **Memory\
  \ efficiency**: Avoid excessive memory allocation for distance matrix computations\n\
  - **Scalability**: Design with potential extension to different circle counts in\
  \ mind\n\n# PROMPT-BLOCK-END\n    \n"
